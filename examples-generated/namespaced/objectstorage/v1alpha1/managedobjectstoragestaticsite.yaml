apiVersion: objectstorage.m.upcloud.com/v1alpha1
kind: ManagedObjectStorageStaticSite
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1alpha1/managedobjectstoragestaticsite
  labels:
    testing.upbound.io/example-name: this
  name: this
  namespace: upbound-system
spec:
  forProvider:
    bucketNameSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    bucketPrefix: public/
    errorPages:
    - errorDocument: 404.html
      statusCode: 404
    serviceUuidSelector:
      matchLabels:
        testing.upbound.io/example-name: example

---

apiVersion: objectstorage.m.upcloud.com/v1alpha1
kind: ManagedObjectStorage
metadata:
  annotations:
    meta.upbound.io/example-id: objectstorage/v1alpha1/managedobjectstoragestaticsite
  labels:
    testing.upbound.io/example-name: this
  name: this
  namespace: upbound-system
spec:
  forProvider:
    configuredStatus: started
    name: example
    region: europe-1

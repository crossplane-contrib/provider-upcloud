apiVersion: provider.m.upcloud.com/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: crossplane-system
spec:
  credentials:
    source: Secret
    # The secret reference is namespace-local: it resolves to the namespace of
    # the referencing managed resource.
    secretRef:
      name: upcloud-creds
      key: creds
